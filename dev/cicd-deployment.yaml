apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-deployment
  template:
    metadata:
      labels:
        app: cicd-deployment
        editor: vscode
    spec:
      containers:
      - name: cicd-deployment
        image: amulu874/index-html:19
        resources:  
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 80
          
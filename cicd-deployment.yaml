apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: cicd-deployment
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: cicd-deployment
        editor: vscode
    spec:
      containers:
      - name: cicd-deployment
        image: amulu874/index-html:TAG
        resources:  
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 80
          